<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asmat Web Studio | Web Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 7%;
            background: #0f172a;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* HERO */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;

            padding: 70px 7%;

            color: white;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-text h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero-text h1 span {
            color: #38bdf8;
        }

        .hero-text h2 {
            margin-bottom: 15px;
            color: #bae6fd;
        }

        .hero-text p {
            font-size: 18px;
            color: #dbeafe;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            margin: 5px;

            background: #38bdf8;
            color: #082f49;

            text-decoration: none;
            font-weight: bold;

            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: translateY(-3px);
        }

        .outline {
            background: transparent;
            color: white;
            border: 2px solid #38bdf8;
        }

        .hero-image {
            width: 420px;
            max-width: 100%;
        }

        .hero-image img {
            width: 100%;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        /* GENERAL */
        section {
            padding: 80px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 36px;
            color: #0f172a;
        }

        .section-title p {
            color: #64748b;
        }

        /* ABOUT */
        .about {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .about-image,
        .about-text {
            flex: 1;
        }

        .about-image img {
            width: 100%;
            border-radius: 20px;
        }

        .about-text h3 {
            font-size: 30px;
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .about-text p {
            color: #475569;
            margin-bottom: 15px;
        }

        /* SKILLS */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .skill {
            padding: 30px 20px;
            text-align: center;

            background: white;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-7px);
        }

        .skill img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* SERVICES */
        .services {
            background: #eef2ff;
        }

        .service-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .service-card {
            padding: 20px;
            text-align: center;

            background: white;
            border-radius: 15px;
